<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel do Cliente - Espeto Caipira</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

</head>
<body>
    <nav class="navbar navbar-expand-lg nav-painel shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold hero-title" href="#">Espeto Caipira</a>
            <div class="d-flex align-items-center">
                <span class="text-bege me-3 d-none d-md-block">Olá, <span id="nomeUsuario">Cliente</span></span>
                <button class="btn btn-cta btn-sm fw-bold px-3 me-2" data-bs-toggle="modal" data-bs-target="#modalNovoAgendamento">
                    + Novo Agendamento
                </button>
                <button class="btn btn-outline-light btn-sm" id="btnSair">Sair</button>
            </div>
        </div>
    </nav>

    <main class="container py-5 min-vh-100">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="text-bege">Meus Orçamentos</h2>
        </div>
        
        <!-- Exemplo visual dos agendamentos do cliente-->
        <div class="row g-4" id="listaAgendamentos">
            <div class="col-md-6 col-lg-4">
                <div class="agendamento-card p-4 rounded-3 shadow-sm">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h5 class="fw-bold mb-0" style="color: var(--destaque-mostarda);">Churrasco Tradicional</h5>
                        <span class="badge bg-warning text-dark">Em Análise</span>
                    </div>
                    <p class="text-bege mb-1">📅 <strong>Data:</strong> 15/12/2026</p>
                    <p class="text-bege mb-1">⏰ <strong>Horário:</strong> 12:00 (4h de evento)</p>
                    <hr class="border-secondary">
                    <p class="text-secundario small mb-0">Total de Convidados: 50</p>
                </div>
            </div>
        </div>
    </main>

    <div class="modal fade" id="modalNovoAgendamento" tabindex="-1" aria-labelledby="modalAgendamentoLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content painel-modal">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold text-bege" id="modalAgendamentoLabel">Solicitar Novo Orçamento</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="formAgendamento">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label text-secundario">Data do Evento</label>
                                <input type="date" class="form-control custom-input" id="dataEvento" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label text-secundario">Horário de Início</label>
                                <input type="time" class="form-control custom-input" id="horaEvento" required>
                            </div>
                            <div class="col-12 mt-2">
                                <label class="form-label text-secundario">Tipo de Cardápio</label>
                                <select class="form-select custom-input" id="tipoCardapio" required>
                                    <option value="Churrasco Tradicional">Churrasco Tradicional</option>
                                    <option value="Churrasco Premium">Churrasco Premium</option>
                                    <option value="Festa Infantil">Festa Infantil</option>
                                </select>
                            </div>
                            
                            <h6 class="text-bege mt-4 border-bottom border-secondary pb-2">Convidados</h6>
                            
                            <div class="col-md-4">
                                <label class="form-label text-secundario">Adultos<br><small>Valor cheio</small></label>
                                <input type="number" class="form-control custom-input" id="qtdAdultos" min="1" value="10" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-secundario">Crianças (0 a 8 anos) <br><small>Isentas</small></label>
                                <input type="number" class="form-control custom-input" id="qtdCriancasIsentas" min="0" value="0">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label text-secundario">Crianças (8 a 11 anos) <br><small>Meia-entrada</small></label>
                                <input type="number" class="form-control custom-input" id="qtdCriancasPagam" min="0" value="0">
                            </div>

                            <h6 class="text-bege mt-4 border-bottom border-secondary pb-2">Adicionais</h6>
                            
                            <div class="col-12">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="adicionalSalada">
                                    <label class="form-check-label text-bege" for="adicionalSalada">
                                        Incluir Salada de Frios (Custo Adicional)
                                    </label>
                                </div>
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="formAgendamento" class="btn btn-cta fw-bold">Enviar Solicitação</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/painel.js"></script>
</body>
</html>
