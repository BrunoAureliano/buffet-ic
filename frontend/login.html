<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Espeto Caipira</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

    <main class="w-100 px-3" style="max-width: 450px;">
        <div class="login-card p-5 rounded-4 shadow-lg">
            <div class="text-center mb-4">
                <h1 class="h2 fw-bold hero-title mb-2">Espeto Caipira</h1>
                <p class="text-secundario">Acesse sua conta para continuar</p>
            </div>

            <form id="formLogin">
                <div class="mb-3">
                    <label for="email" class="form-label text-bege">E-mail</label>
                    <input type="email" class="form-control custom-input" id="email" placeholder="seu@email.com" required>
                </div>
                
                <div class="mb-4">
                    <label for="senha" class="form-label text-bege">Senha</label>
                    <input type="password" class="form-control custom-input" id="senha" placeholder="••••••••" required>
                </div>

                <button class="btn btn-cta w-100 py-3 fw-bold mb-4" type="submit">Entrar no Sistema</button>
                
                <div class="d-flex justify-content-between align-items-center">
                    <a href="index.html" class="text-decoration-none footer-link text-secundario small">← Voltar ao Início</a>
                    <a href="#" class="text-decoration-none footer-link text-secundario small">Criar uma conta</a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
