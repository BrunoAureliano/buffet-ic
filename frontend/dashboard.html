<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard do Gestor - Espeto Caipira</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="min-vh-100" style="background-color: #3b2314;">

    <!-- Barra de Navegação -->
    <nav class="navbar navbar-expand-lg nav-painel shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold hero-title" href="index.html">Espeto Caipira | Gestão</a>
            <div class="d-flex align-items-center">
                <span class="text-bege me-3 d-none d-md-block">Olá, <span id="nomeAdmin">Gestor</span></span>
                <button class="btn btn-outline-light btn-sm" id="btnSairAdmin">Sair</button>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal com Accordions (Tema Dark ativado para os componentes) -->
    <main class="container py-4" data-bs-theme="dark">
        <h2 class="text-bege mb-4">Controle de Orçamentos</h2>

        <!-- Bloco 1: Solicitações Pendentes -->
        <h5 class="text-warning mb-3 fw-bold">⏳ A Aceitar / Recusar</h5>
        <div class="accordion mb-5 shadow-sm" id="accordionPendentes">
            <div class="text-secundario px-2">Carregando solicitações...</div>
        </div>

        <!-- Bloco 2: Festas Aprovadas -->
        <h5 class="text-success mb-3 fw-bold">✅ Festas Confirmadas</h5>
        <div class="accordion mb-5 shadow-sm" id="accordionAprovados">
            <div class="text-secundario px-2">Carregando eventos...</div>
        </div>

        <!-- Bloco 3: Festas Recusadas -->
        <h5 class="text-danger mb-3 fw-bold">❌ Histórico de Recusados</h5>
        <div class="accordion mb-5 shadow-sm" id="accordionRecusados">
            <div class="text-secundario px-2">Carregando histórico...</div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/dashboard.js"></script> 

</body>
</html>
